<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务首页</title>
    <style id="theme-vars">
:root {
  /* ===== Brand Prefix: todo ===== */
  /* ===== Primary: Sage Green ===== */
  --todo-primary-50: #f0f7f0;
  --todo-primary-100: #dceedd;
  --todo-primary-200: #b5ddbb;
  --todo-primary-300: #82c492;
  --todo-primary-400: #56a86a;
  --todo-primary-500: #3d8f52;
  --todo-primary-600: #2e7340;
  --todo-primary-700: #265c35;
  --todo-primary-800: #21492d;
  --todo-primary-900: #1c3c27;

  /* ===== Neutral: Warm Gray ===== */
  --todo-neutral-50: #fafaf9;
  --todo-neutral-100: #f5f5f4;
  --todo-neutral-200: #e7e5e4;
  --todo-neutral-300: #d6d3d1;
  --todo-neutral-400: #a8a29e;
  --todo-neutral-500: #78716c;
  --todo-neutral-600: #57534e;
  --todo-neutral-700: #44403c;
  --todo-neutral-800: #292524;
  --todo-neutral-900: #1c1917;

  /* ===== State Colors (semantic only) ===== */
  --state-success: #22c55e;
  --state-warning: #f59e0b;
  --state-error: #ef4444;
  --state-info: #3b82f6;

  /* ===== Surface & Background ===== */
  --todo-bg: #fafaf9;
  --todo-bg-subtle: #f5f5f4;
  --todo-bg-card: #ffffff;
  --todo-bg-elevated: #ffffff;
  --todo-bg-inverse: #1c1917;

  /* ===== Text ===== */
  --todo-text-primary: #1c1917;
  --todo-text-secondary: #57534e;
  --todo-text-tertiary: #a8a29e;
  --todo-text-inverse: #fafaf9;
  --todo-text-link: #3d8f52;

  /* ===== Border ===== */
  --todo-border: #e7e5e4;
  --todo-border-hover: #d6d3d1;

  /* ===== Radius Scale ===== */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-full: 9999px;

  /* ===== Shadow (border-first, alpha <= 0.05 for static) ===== */
  --shadow-sm: 0 1px 2px rgba(28, 25, 23, 0.03);
  --shadow-md: 0 2px 8px rgba(28, 25, 23, 0.04);
  --shadow-float: 0 8px 24px rgba(28, 25, 23, 0.08);

  /* ===== Spacing ===== */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;

  /* ===== Typography ===== */
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
  --todo-heading-1: 700 24px/1.3 var(--font-sans);
  --todo-heading-2: 600 20px/1.35 var(--font-sans);
  --todo-heading-3: 600 16px/1.4 var(--font-sans);
  --todo-body: 400 14px/1.6 var(--font-sans);
  --todo-body-sm: 400 12px/1.5 var(--font-sans);
  --todo-caption: 400 11px/1.4 var(--font-sans);
}

/* ===== Typography Classes ===== */
.todo-h1 { font: var(--todo-heading-1); color: var(--todo-text-primary); }
.todo-h2 { font: var(--todo-heading-2); color: var(--todo-text-primary); }
.todo-h3 { font: var(--todo-heading-3); color: var(--todo-text-primary); }
.todo-body { font: var(--todo-body); color: var(--todo-text-secondary); }
.todo-body-sm { font: var(--todo-body-sm); color: var(--todo-text-tertiary); }
.todo-caption { font: var(--todo-caption); color: var(--todo-text-tertiary); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-border: var(--todo-border);
  }
  @layer base {
    body { background: var(--todo-background); color: var(--todo-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased" style="font-family: var(--font-sans); background: var(--todo-bg); color: var(--todo-text-primary);">
    <main class="relative mx-auto max-w-[430px] min-h-screen pb-24">

        <!-- Top Header Area -->
        <div class="flex items-start justify-between px-5 pt-14 pb-4">
            <div>
                <h1 class="todo-h1 text-[26px] leading-tight tracking-tight" style="color: var(--todo-text-primary);">下午好</h1>
                <p class="mt-1 text-[13px]" style="color: var(--todo-text-tertiary); font: var(--todo-body-sm);">6月28日 周日</p>
            </div>
            <div class="flex items-center justify-center w-10 h-10 rounded-full shrink-0" style="background: var(--todo-primary-100);">
                <span class="text-[14px] font-semibold" style="color: var(--todo-primary-700);">L</span>
            </div>
        </div>

        <!-- Quick Stats Row -->
        <div class="flex gap-2.5 px-5 pb-5">
            <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full" style="background: var(--todo-primary-100);">
                <span class="w-1.5 h-1.5 rounded-full" style="background: var(--todo-primary-500);"></span>
                <span class="text-[12px] font-medium" style="color: var(--todo-text-secondary);">今天</span>
                <span class="text-[12px] font-bold" style="color: var(--todo-primary-700);">5 项</span>
            </div>
            <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full" style="background: var(--todo-primary-100);">
                <span class="text-[12px] font-medium" style="color: var(--todo-text-secondary);">已完成</span>
                <span class="text-[12px] font-bold" style="color: var(--todo-primary-700);">3</span>
            </div>
            <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full" style="background: var(--todo-primary-100);">
                <span class="text-[12px] font-medium" style="color: var(--todo-text-secondary);">待处理</span>
                <span class="text-[12px] font-bold" style="color: var(--todo-primary-700);">2</span>
            </div>
        </div>

        <!-- Filter Tabs -->
        <div class="flex gap-2 px-5 pb-5 overflow-x-auto no-scrollbar">
            <button class="shrink-0 px-4 py-1.5 rounded-full text-[13px] font-medium transition-colors duration-200" style="background: var(--todo-primary-500); color: var(--todo-text-inverse);">全部</button>
            <button class="shrink-0 px-4 py-1.5 rounded-full text-[13px] font-medium transition-colors duration-200" style="background: var(--todo-bg-subtle); color: var(--todo-text-secondary);">工作</button>
            <button class="shrink-0 px-4 py-1.5 rounded-full text-[13px] font-medium transition-colors duration-200" style="background: var(--todo-bg-subtle); color: var(--todo-text-secondary);">生活</button>
            <button class="shrink-0 px-4 py-1.5 rounded-full text-[13px] font-medium transition-colors duration-200" style="background: var(--todo-bg-subtle); color: var(--todo-text-secondary);">学习</button>
        </div>

        <!-- Task List -->
        <div class="flex flex-col gap-2.5 px-4">

            <!-- Task 1: 完成项目方案 — high priority, 工作, 今天 -->
            <div class="flex items-center gap-3 rounded-[var(--radius-md)] border px-4 py-3.5" style="background: var(--todo-bg-card); border-color: var(--todo-border);">
                <div class="flex items-center justify-center w-5 h-5 rounded-full border-2 shrink-0 cursor-pointer" style="border-color: var(--todo-primary-400);"></div>
                <div class="flex-1 min-w-0">
                    <p class="text-[14px] font-medium leading-snug" style="color: var(--todo-text-primary);">完成项目方案</p>
                    <div class="flex items-center gap-2 mt-1">
                        <span class="inline-block px-2 py-0.5 rounded-full text-[10px] font-medium" style="background: var(--todo-primary-50); color: var(--todo-primary-700);">工作</span>
                        <span class="text-[11px]" style="color: var(--todo-text-tertiary);">今天</span>
                    </div>
                </div>
                <div class="w-2.5 h-2.5 rounded-full shrink-0" style="background: var(--state-error);"></div>
            </div>

            <!-- Task 2: 购买食材 — none priority, 生活, 今天, COMPLETED -->
            <div class="flex items-center gap-3 rounded-[var(--radius-md)] border px-4 py-3.5" style="background: var(--todo-bg-card); border-color: var(--todo-border);">
                <div class="flex items-center justify-center w-5 h-5 rounded-full shrink-0 cursor-pointer" style="background: var(--todo-primary-500);">
                    <svg class="w-3 h-3 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-[14px] font-medium leading-snug line-through" style="color: var(--todo-text-tertiary);">购买食材</p>
                    <div class="flex items-center gap-2 mt-1">
                        <span class="inline-block px-2 py-0.5 rounded-full text-[10px] font-medium" style="background: var(--todo-primary-50); color: var(--todo-text-tertiary);">生活</span>
                        <span class="text-[11px]" style="color: var(--todo-text-tertiary);">今天</span>
                    </div>
                </div>
                <div class="w-2.5 h-2.5 shrink-0"></div>
            </div>

            <!-- Task 3: 阅读设计文章 — none priority, 学习, 明天 -->
            <div class="flex items-center gap-3 rounded-[var(--radius-md)] border px-4 py-3.5" style="background: var(--todo-bg-card); border-color: var(--todo-border);">
                <div class="flex items-center justify-center w-5 h-5 rounded-full border-2 shrink-0 cursor-pointer" style="border-color: var(--todo-primary-400);"></div>
                <div class="flex-1 min-w-0">
                    <p class="text-[14px] font-medium leading-snug" style="color: var(--todo-text-primary);">阅读设计文章</p>
                    <div class="flex items-center gap-2 mt-1">
                        <span class="inline-block px-2 py-0.5 rounded-full text-[10px] font-medium" style="background: var(--todo-primary-50); color: var(--todo-primary-700);">学习</span>
                        <span class="text-[11px]" style="color: var(--todo-text-tertiary);">明天</span>
                    </div>
                </div>
                <div class="w-2.5 h-2.5 shrink-0"></div>
            </div>

            <!-- Task 4: 回复客户邮件 — medium priority (amber), 工作, 今天 -->
            <div class="flex items-center gap-3 rounded-[var(--radius-md)] border px-4 py-3.5" style="background: var(--todo-bg-card); border-color: var(--todo-border);">
                <div class="flex items-center justify-center w-5 h-5 rounded-full border-2 shrink-0 cursor-pointer" style="border-color: var(--todo-primary-400);"></div>
                <div class="flex-1 min-w-0">
                    <p class="text-[14px] font-medium leading-snug" style="color: var(--todo-text-primary);">回复客户邮件</p>
                    <div class="flex items-center gap-2 mt-1">
                        <span class="inline-block px-2 py-0.5 rounded-full text-[10px] font-medium" style="background: var(--todo-primary-50); color: var(--todo-primary-700);">工作</span>
                        <span class="text-[11px]" style="color: var(--todo-text-tertiary);">今天</span>
                    </div>
                </div>
                <div class="w-2.5 h-2.5 rounded-full shrink-0" style="background: var(--state-warning);"></div>
            </div>

            <!-- Task 5: 整理桌面 — none priority, 生活, 周三 -->
            <div class="flex items-center gap-3 rounded-[var(--radius-md)] border px-4 py-3.5" style="background: var(--todo-bg-card); border-color: var(--todo-border);">
                <div class="flex items-center justify-center w-5 h-5 rounded-full border-2 shrink-0 cursor-pointer" style="border-color: var(--todo-primary-400);"></div>
                <div class="flex-1 min-w-0">
                    <p class="text-[14px] font-medium leading-snug" style="color: var(--todo-text-primary);">整理桌面</p>
                    <div class="flex items-center gap-2 mt-1">
                        <span class="inline-block px-2 py-0.5 rounded-full text-[10px] font-medium" style="background: var(--todo-primary-50); color: var(--todo-primary-700);">生活</span>
                        <span class="text-[11px]" style="color: var(--todo-text-tertiary);">周三</span>
                    </div>
                </div>
                <div class="w-2.5 h-2.5 shrink-0"></div>
            </div>

            <!-- Task 6: 准备周会材料 — high priority, 工作, 明天 -->
            <div class="flex items-center gap-3 rounded-[var(--radius-md)] border px-4 py-3.5" style="background: var(--todo-bg-card); border-color: var(--todo-border);">
                <div class="flex items-center justify-center w-5 h-5 rounded-full border-2 shrink-0 cursor-pointer" style="border-color: var(--todo-primary-400);"></div>
                <div class="flex-1 min-w-0">
                    <p class="text-[14px] font-medium leading-snug" style="color: var(--todo-text-primary);">准备周会材料</p>
                    <div class="flex items-center gap-2 mt-1">
                        <span class="inline-block px-2 py-0.5 rounded-full text-[10px] font-medium" style="background: var(--todo-primary-50); color: var(--todo-primary-700);">工作</span>
                        <span class="text-[11px]" style="color: var(--todo-text-tertiary);">明天</span>
                    </div>
                </div>
                <div class="w-2.5 h-2.5 rounded-full shrink-0" style="background: var(--state-error);"></div>
            </div>

        </div>

        <!-- FAB Button -->
        <button data-dom-id="fab-add" class="fixed bottom-24 right-4 z-40 flex items-center justify-center w-12 h-12 rounded-full transition-transform duration-200 active:scale-95" style="background: var(--todo-primary-500); box-shadow: var(--shadow-float); max-width: calc((430px - 0px) / 2 + 16px); right: max(16px, calc(50vw - 215px + 16px));">
            <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        </button>

        <!-- Bottom Tab Bar (inherited from project-shell.html) -->
        <nav class="fixed bottom-0 left-0 right-0 z-50 bg-[var(--todo-bg-card)] border-t border-[var(--todo-border)]"
             style="padding-bottom: env(safe-area-inset-bottom, 0px); font-family: var(--font-sans);">
            <div class="flex items-end justify-around px-2 pt-2 pb-2 max-w-[430px] mx-auto">

                <!-- Tasks Tab (active) -->
                <button data-tab-key="tasks" data-active="true"
                        class="flex flex-col items-center justify-center gap-0.5 w-16 h-14 rounded-xl transition-colors duration-200 bg-[var(--todo-primary-50)]">
                    <svg class="w-5 h-5 text-[var(--todo-primary-500)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 11l3 3L22 4"/>
                        <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
                    </svg>
                    <span class="text-[10px] font-medium text-[var(--todo-primary-500)]">Tasks</span>
                </button>

                <!-- Add Tab (Center FAB in tab bar) -->
                <button data-tab-key="add"
                        class="flex items-center justify-center w-12 h-12 -mt-6 rounded-full bg-[var(--todo-primary-500)] shadow-[var(--shadow-float)] transition-transform duration-200 active:scale-95">
                    <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="8" x2="12" y2="16"/>
                        <line x1="8" y1="12" x2="16" y2="12"/>
                    </svg>
                </button>

                <!-- Categories Tab -->
                <button data-dom-id="tab-categories" data-tab-key="categories"
                        class="flex flex-col items-center justify-center gap-0.5 w-16 h-14 rounded-xl transition-colors duration-200">
                    <svg class="w-5 h-5 text-[var(--todo-text-tertiary)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 20a2 2 0 002-2V8a2 2 0 00-2-2h-7.93a2 2 0 01-1.66-.9l-.82-1.2A2 2 0 008.93 3H4a2 2 0 00-2 2v13a2 2 0 002 2h16z"/>
                        <line x1="12" y1="11" x2="12" y2="17"/>
                        <line x1="9" y1="14" x2="15" y2="14"/>
                    </svg>
                    <span class="text-[10px] font-medium text-[var(--todo-text-tertiary)]">Categories</span>
                </button>

            </div>
        </nav>

    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
