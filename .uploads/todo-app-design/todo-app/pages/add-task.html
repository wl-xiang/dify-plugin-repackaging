<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加任务</title>
    <style id="theme-vars">
:root {
  /* ===== Brand Prefix: todo ===== */
  /* ===== Primary: Sage Green ===== */
  --todo-primary-50: #f0f7f0;
  --todo-primary-100: #dceedd;
  --todo-primary-200: #b5ddbb;
  --todo-primary-300: #82c492;
  --todo-primary-400: #56a86a;
  --todo-primary-500: #3d8f52;
  --todo-primary-600: #2e7340;
  --todo-primary-700: #265c35;
  --todo-primary-800: #21492d;
  --todo-primary-900: #1c3c27;

  /* ===== Neutral: Warm Gray ===== */
  --todo-neutral-50: #fafaf9;
  --todo-neutral-100: #f5f5f4;
  --todo-neutral-200: #e7e5e4;
  --todo-neutral-300: #d6d3d1;
  --todo-neutral-400: #a8a29e;
  --todo-neutral-500: #78716c;
  --todo-neutral-600: #57534e;
  --todo-neutral-700: #44403c;
  --todo-neutral-800: #292524;
  --todo-neutral-900: #1c1917;

  /* ===== State Colors (semantic only) ===== */
  --state-success: #22c55e;
  --state-warning: #f59e0b;
  --state-error: #ef4444;
  --state-info: #3b82f6;

  /* ===== Surface & Background ===== */
  --todo-bg: #fafaf9;
  --todo-bg-subtle: #f5f5f4;
  --todo-bg-card: #ffffff;
  --todo-bg-elevated: #ffffff;
  --todo-bg-inverse: #1c1917;

  /* ===== Text ===== */
  --todo-text-primary: #1c1917;
  --todo-text-secondary: #57534e;
  --todo-text-tertiary: #a8a29e;
  --todo-text-inverse: #fafaf9;
  --todo-text-link: #3d8f52;

  /* ===== Border ===== */
  --todo-border: #e7e5e4;
  --todo-border-hover: #d6d3d1;

  /* ===== Radius Scale ===== */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-full: 9999px;

  /* ===== Shadow (border-first, alpha <= 0.05 for static) ===== */
  --shadow-sm: 0 1px 2px rgba(28, 25, 23, 0.03);
  --shadow-md: 0 2px 8px rgba(28, 25, 23, 0.04);
  --shadow-float: 0 8px 24px rgba(28, 25, 23, 0.08);

  /* ===== Spacing ===== */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;

  /* ===== Typography ===== */
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
  --todo-heading-1: 700 24px/1.3 var(--font-sans);
  --todo-heading-2: 600 20px/1.35 var(--font-sans);
  --todo-heading-3: 600 16px/1.4 var(--font-sans);
  --todo-body: 400 14px/1.6 var(--font-sans);
  --todo-body-sm: 400 12px/1.5 var(--font-sans);
  --todo-caption: 400 11px/1.4 var(--font-sans);
}

/* ===== Typography Classes ===== */
.todo-h1 { font: var(--todo-heading-1); color: var(--todo-text-primary); }
.todo-h2 { font: var(--todo-heading-2); color: var(--todo-text-primary); }
.todo-h3 { font: var(--todo-heading-3); color: var(--todo-text-primary); }
.todo-body { font: var(--todo-body); color: var(--todo-text-secondary); }
.todo-body-sm { font: var(--todo-body-sm); color: var(--todo-text-tertiary); }
.todo-caption { font: var(--todo-caption); color: var(--todo-text-tertiary); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-border: var(--todo-border);
  }
  @layer base {
    body { background: var(--todo-background); color: var(--todo-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main>
      <div class="max-w-[430px] mx-auto min-h-screen" style="font-family: var(--font-sans); background: var(--todo-bg); padding-bottom: 140px;">

        <!-- Top Header -->
        <div class="flex items-center gap-3 px-5 pt-14 pb-4">
          <svg class="w-5 h-5 text-[var(--todo-text-primary)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
          <h1 class="todo-h2">新建任务</h1>
        </div>

        <!-- Form -->
        <div class="px-5 flex flex-col gap-6">

          <!-- Task Title (Hero Input) -->
          <div>
            <label class="todo-h3 block mb-2">任务标题</label>
            <input
              type="text"
              placeholder="输入任务名称..."
              class="w-full bg-transparent border-0 border-b-2 border-[var(--todo-primary-200)] focus:border-[var(--todo-primary-500)] outline-none transition-colors duration-200 pb-3"
              style="font-size: 18px; color: var(--todo-text-primary); font-family: var(--font-sans);"
            />
          </div>

          <!-- Task Description -->
          <div>
            <label class="todo-h3 block mb-2">任务描述</label>
            <textarea
              placeholder="添加详细描述（可选）"
              rows="3"
              class="w-full resize-none rounded-[var(--radius-md)] border border-[var(--todo-border)] outline-none transition-colors duration-200 px-4 py-3"
              style="background: var(--todo-bg-subtle); color: var(--todo-text-primary); font: var(--todo-body);"
            ></textarea>
          </div>

          <!-- Category Selector -->
          <div>
            <label class="todo-h3 block mb-3">选择分类</label>
            <div class="flex gap-2 flex-wrap">
              <!-- Work - Selected -->
              <button class="flex items-center gap-2 px-4 py-2 rounded-[var(--radius-full)] text-sm font-medium text-white" style="background: var(--todo-primary-500);">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
                  <path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/>
                </svg>
                工作
              </button>
              <!-- Life - Unselected -->
              <button class="flex items-center gap-2 px-4 py-2 rounded-[var(--radius-full)] text-sm font-medium" style="background: var(--todo-neutral-100); color: var(--todo-text-secondary);">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
                  <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
                生活
              </button>
              <!-- Study - Unselected -->
              <button class="flex items-center gap-2 px-4 py-2 rounded-[var(--radius-full)] text-sm font-medium" style="background: var(--todo-neutral-100); color: var(--todo-text-secondary);">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 19.5A2.5 2.5 0 016.5 17H20"/>
                  <path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>
                </svg>
                学习
              </button>
            </div>
          </div>

          <!-- Priority Selector -->
          <div>
            <label class="todo-h3 block mb-3">优先级</label>
            <div class="flex gap-3">
              <!-- High - Selected -->
              <button class="flex items-center gap-2 px-4 py-2.5 rounded-[var(--radius-md)] text-sm font-medium border-l-[3px]" style="border-left-color: var(--state-error); background: rgba(239,68,68,0.08); color: var(--todo-text-primary);">
                <span class="w-2 h-2 rounded-full inline-block" style="background: var(--state-error);"></span>
                高
              </button>
              <!-- Medium -->
              <button class="flex items-center gap-2 px-4 py-2.5 rounded-[var(--radius-md)] text-sm font-medium" style="background: var(--todo-neutral-100); color: var(--todo-text-secondary);">
                <span class="w-2 h-2 rounded-full inline-block" style="background: var(--state-warning);"></span>
                中
              </button>
              <!-- Low -->
              <button class="flex items-center gap-2 px-4 py-2.5 rounded-[var(--radius-md)] text-sm font-medium" style="background: var(--todo-neutral-100); color: var(--todo-text-secondary);">
                <span class="w-2 h-2 rounded-full inline-block" style="background: var(--state-success);"></span>
                低
              </button>
            </div>
          </div>

          <!-- Due Date -->
          <div>
            <label class="todo-h3 block mb-3">截止日期</label>
            <div class="flex items-center justify-between rounded-[var(--radius-md)] border border-[var(--todo-border)] px-4 py-3" style="background: var(--todo-bg-card);">
              <div class="flex items-center gap-3">
                <svg class="w-5 h-5 text-[var(--todo-primary-500)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                  <line x1="16" y1="2" x2="16" y2="6"/>
                  <line x1="8" y1="2" x2="8" y2="6"/>
                  <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
                <div>
                  <div class="text-sm font-medium" style="color: var(--todo-text-primary);">今天, 6月28日</div>
                </div>
              </div>
              <svg class="w-4 h-4 text-[var(--todo-text-tertiary)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"/>
              </svg>
            </div>
          </div>

          <!-- Reminder Toggle -->
          <div>
            <div class="flex items-center justify-between rounded-[var(--radius-md)] border border-[var(--todo-border)] px-4 py-3" style="background: var(--todo-bg-card);">
              <div class="flex items-center gap-3">
                <svg class="w-5 h-5 text-[var(--todo-primary-500)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                  <path d="M13.73 21a2 2 0 01-3.46 0"/>
                </svg>
                <span class="text-sm font-medium" style="color: var(--todo-text-primary);">设置提醒</span>
              </div>
              <!-- Toggle Switch (ON) -->
              <div class="w-11 h-6 rounded-full relative cursor-pointer" style="background: var(--todo-primary-500);">
                <div class="absolute right-0.5 top-0.5 w-5 h-5 rounded-full bg-white shadow-sm"></div>
              </div>
            </div>
          </div>

        </div>
      </div>

      <!-- Fixed Save Button (above tab bar) -->
      <div class="fixed bottom-[68px] left-0 right-0 z-40 px-5 pb-3 pt-2 max-w-[430px] mx-auto" style="background: var(--todo-bg);">
        <button
          data-dom-id="save-task"
          class="w-full rounded-[var(--radius-full)] text-white font-semibold text-base transition-opacity duration-200 active:opacity-90"
          style="height: 48px; background: var(--todo-primary-500);"
        >
          保存任务
        </button>
      </div>

    </main>

    <!-- Bottom Tab Bar -->
    <nav class="fixed bottom-0 left-0 right-0 z-50 border-t border-[var(--todo-border)]" style="background: var(--todo-bg-card); padding-bottom: env(safe-area-inset-bottom, 0px); font-family: var(--font-sans);">
      <div class="flex items-end justify-around px-2 pt-2 pb-2 max-w-lg mx-auto">

        <!-- Tasks Tab -->
        <button data-tab-key="tasks" data-dom-id="tab-tasks-add"
                class="flex flex-col items-center justify-center gap-0.5 w-16 h-14 rounded-xl transition-colors duration-200">
          <svg class="w-5 h-5" style="color: var(--todo-text-tertiary);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 11l3 3L22 4"/>
            <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
          </svg>
          <span class="text-[10px] font-medium" style="color: var(--todo-text-tertiary);">Tasks</span>
        </button>

        <!-- Add Tab (Center FAB) - Active -->
        <button data-tab-key="add" data-active="true"
                class="flex items-center justify-center w-12 h-12 -mt-6 rounded-full shadow-[var(--shadow-float)] transition-transform duration-200 active:scale-95"
                style="background: var(--todo-primary-500);">
          <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="16"/>
            <line x1="8" y1="12" x2="16" y2="12"/>
          </svg>
        </button>

        <!-- Categories Tab -->
        <button data-tab-key="categories" data-dom-id="tab-categories-add"
                class="flex flex-col items-center justify-center gap-0.5 w-16 h-14 rounded-xl transition-colors duration-200">
          <svg class="w-5 h-5" style="color: var(--todo-text-tertiary);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 20a2 2 0 002-2V8a2 2 0 00-2-2h-7.93a2 2 0 01-1.66-.9l-.82-1.2A2 2 0 008.93 3H4a2 2 0 00-2 2v13a2 2 0 002 2h16z"/>
            <line x1="12" y1="11" x2="12" y2="17"/>
            <line x1="9" y1="14" x2="15" y2="14"/>
          </svg>
          <span class="text-[10px] font-medium" style="color: var(--todo-text-tertiary);">Categories</span>
        </button>

      </div>
    </nav>

    <script>lucide.createIcons();</script>
</body>
</html>
