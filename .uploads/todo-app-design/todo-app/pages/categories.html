<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分类管理</title>
    <style id="theme-vars">
:root {
  /* ===== Brand Prefix: todo ===== */
  /* ===== Primary: Sage Green ===== */
  --todo-primary-50: #f0f7f0;
  --todo-primary-100: #dceedd;
  --todo-primary-200: #b5ddbb;
  --todo-primary-300: #82c492;
  --todo-primary-400: #56a86a;
  --todo-primary-500: #3d8f52;
  --todo-primary-600: #2e7340;
  --todo-primary-700: #265c35;
  --todo-primary-800: #21492d;
  --todo-primary-900: #1c3c27;

  /* ===== Neutral: Warm Gray ===== */
  --todo-neutral-50: #fafaf9;
  --todo-neutral-100: #f5f5f4;
  --todo-neutral-200: #e7e5e4;
  --todo-neutral-300: #d6d3d1;
  --todo-neutral-400: #a8a29e;
  --todo-neutral-500: #78716c;
  --todo-neutral-600: #57534e;
  --todo-neutral-700: #44403c;
  --todo-neutral-800: #292524;
  --todo-neutral-900: #1c1917;

  /* ===== State Colors (semantic only) ===== */
  --state-success: #22c55e;
  --state-warning: #f59e0b;
  --state-error: #ef4444;
  --state-info: #3b82f6;

  /* ===== Surface & Background ===== */
  --todo-bg: #fafaf9;
  --todo-bg-subtle: #f5f5f4;
  --todo-bg-card: #ffffff;
  --todo-bg-elevated: #ffffff;
  --todo-bg-inverse: #1c1917;

  /* ===== Text ===== */
  --todo-text-primary: #1c1917;
  --todo-text-secondary: #57534e;
  --todo-text-tertiary: #a8a29e;
  --todo-text-inverse: #fafaf9;
  --todo-text-link: #3d8f52;

  /* ===== Border ===== */
  --todo-border: #e7e5e4;
  --todo-border-hover: #d6d3d1;

  /* ===== Radius Scale ===== */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-full: 9999px;

  /* ===== Shadow (border-first, alpha <= 0.05 for static) ===== */
  --shadow-sm: 0 1px 2px rgba(28, 25, 23, 0.03);
  --shadow-md: 0 2px 8px rgba(28, 25, 23, 0.04);
  --shadow-float: 0 8px 24px rgba(28, 25, 23, 0.08);

  /* ===== Spacing ===== */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;

  /* ===== Typography ===== */
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
  --todo-heading-1: 700 24px/1.3 var(--font-sans);
  --todo-heading-2: 600 20px/1.35 var(--font-sans);
  --todo-heading-3: 600 16px/1.4 var(--font-sans);
  --todo-body: 400 14px/1.6 var(--font-sans);
  --todo-body-sm: 400 12px/1.5 var(--font-sans);
  --todo-caption: 400 11px/1.4 var(--font-sans);
}

/* ===== Typography Classes ===== */
.todo-h1 { font: var(--todo-heading-1); color: var(--todo-text-primary); }
.todo-h2 { font: var(--todo-heading-2); color: var(--todo-text-primary); }
.todo-h3 { font: var(--todo-heading-3); color: var(--todo-text-primary); }
.todo-body { font: var(--todo-body); color: var(--todo-text-secondary); }
.todo-body-sm { font: var(--todo-body-sm); color: var(--todo-text-tertiary); }
.todo-caption { font: var(--todo-caption); color: var(--todo-text-tertiary); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-border: var(--todo-border);
  }
  @layer base {
    body { background: var(--todo-bg); color: var(--todo-text-primary); font-family: var(--font-sans); }
    td, th { word-break: break-all; word-break: auto-phrase; }
    th { white-space: nowrap; }
  }
    </style>
</head>
<body>

  <main class="max-w-[430px] mx-auto px-5 pb-[calc(80px+env(safe-area-inset-bottom,0px))]">

    <!-- Page Header -->
    <div class="flex items-center justify-between pt-14 pb-2">
      <h1 class="text-xl font-semibold" style="color: var(--todo-text-primary);">分类管理</h1>
      <button class="text-base font-semibold border-none bg-transparent cursor-pointer py-2" style="color: var(--todo-primary-500);">新建</button>
    </div>

    <!-- Summary -->
    <p class="text-xs mb-5 pl-0.5" style="color: var(--todo-text-tertiary);">共 4 个分类</p>

    <!-- Category Card List -->
    <div class="flex flex-col gap-3">

      <!-- 1. 工作 (Work) -->
      <div class="flex items-center border rounded-[var(--radius-md)] p-4 cursor-pointer transition-colors duration-200" style="background: var(--todo-bg-card); border-color: var(--todo-border);">
        <div class="flex items-center gap-3 flex-shrink-0 min-w-[80px]">
          <div class="w-3 h-3 rounded-full flex-shrink-0" style="background: var(--state-success);"></div>
          <div class="w-10 h-10 rounded-[var(--radius-sm)] flex items-center justify-center flex-shrink-0" style="background: var(--todo-primary-50);">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="var(--todo-primary-500)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
              <path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/>
            </svg>
          </div>
        </div>
        <div class="flex-1 min-w-0 ml-1">
          <div class="text-base font-semibold" style="color: var(--todo-text-primary); line-height: 1.3;">工作</div>
          <div class="text-xs mt-0.5" style="color: var(--todo-text-tertiary);">项目、会议、报告</div>
          <div class="text-xs mt-1.5" style="color: var(--todo-text-secondary);">12 项任务</div>
        </div>
        <div class="flex items-center gap-2 flex-shrink-0 ml-3">
          <button class="bg-transparent border-none cursor-pointer p-1 transition-colors duration-200" style="color: var(--todo-text-tertiary);">
            <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="currentColor">
              <circle cx="12" cy="6" r="1.5"/>
              <circle cx="12" cy="12" r="1.5"/>
              <circle cx="12" cy="18" r="1.5"/>
            </svg>
          </button>
          <button class="bg-transparent border-none cursor-pointer p-1 transition-colors duration-200" style="color: var(--todo-text-tertiary);">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- 2. 生活 (Life) -->
      <div class="flex items-center border rounded-[var(--radius-md)] p-4 cursor-pointer transition-colors duration-200" style="background: var(--todo-bg-card); border-color: var(--todo-border);">
        <div class="flex items-center gap-3 flex-shrink-0 min-w-[80px]">
          <div class="w-3 h-3 rounded-full flex-shrink-0" style="background: var(--state-warning);"></div>
          <div class="w-10 h-10 rounded-[var(--radius-sm)] flex items-center justify-center flex-shrink-0" style="background: rgba(245, 158, 11, 0.08);">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="var(--state-warning)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
          </div>
        </div>
        <div class="flex-1 min-w-0 ml-1">
          <div class="text-base font-semibold" style="color: var(--todo-text-primary); line-height: 1.3;">生活</div>
          <div class="text-xs mt-0.5" style="color: var(--todo-text-tertiary);">购物、家务、健康</div>
          <div class="text-xs mt-1.5" style="color: var(--todo-text-secondary);">8 项任务</div>
        </div>
        <div class="flex items-center gap-2 flex-shrink-0 ml-3">
          <button class="bg-transparent border-none cursor-pointer p-1 transition-colors duration-200" style="color: var(--todo-text-tertiary);">
            <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="currentColor">
              <circle cx="12" cy="6" r="1.5"/>
              <circle cx="12" cy="12" r="1.5"/>
              <circle cx="12" cy="18" r="1.5"/>
            </svg>
          </button>
          <button class="bg-transparent border-none cursor-pointer p-1 transition-colors duration-200" style="color: var(--todo-text-tertiary);">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- 3. 学习 (Study) -->
      <div class="flex items-center border rounded-[var(--radius-md)] p-4 cursor-pointer transition-colors duration-200" style="background: var(--todo-bg-card); border-color: var(--todo-border);">
        <div class="flex items-center gap-3 flex-shrink-0 min-w-[80px]">
          <div class="w-3 h-3 rounded-full flex-shrink-0" style="background: var(--state-info);"></div>
          <div class="w-10 h-10 rounded-[var(--radius-sm)] flex items-center justify-center flex-shrink-0" style="background: rgba(59, 130, 246, 0.08);">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="var(--state-info)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5A2.5 2.5 0 016.5 17H20"/>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>
            </svg>
          </div>
        </div>
        <div class="flex-1 min-w-0 ml-1">
          <div class="text-base font-semibold" style="color: var(--todo-text-primary); line-height: 1.3;">学习</div>
          <div class="text-xs mt-0.5" style="color: var(--todo-text-tertiary);">阅读、课程、笔记</div>
          <div class="text-xs mt-1.5" style="color: var(--todo-text-secondary);">5 项任务</div>
        </div>
        <div class="flex items-center gap-2 flex-shrink-0 ml-3">
          <button class="bg-transparent border-none cursor-pointer p-1 transition-colors duration-200" style="color: var(--todo-text-tertiary);">
            <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="currentColor">
              <circle cx="12" cy="6" r="1.5"/>
              <circle cx="12" cy="12" r="1.5"/>
              <circle cx="12" cy="18" r="1.5"/>
            </svg>
          </button>
          <button class="bg-transparent border-none cursor-pointer p-1 transition-colors duration-200" style="color: var(--todo-text-tertiary);">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- 4. 灵感 (Ideas) -->
      <div class="flex items-center border rounded-[var(--radius-md)] p-4 cursor-pointer transition-colors duration-200" style="background: var(--todo-bg-card); border-color: var(--todo-border);">
        <div class="flex items-center gap-3 flex-shrink-0 min-w-[80px]">
          <div class="w-3 h-3 rounded-full flex-shrink-0" style="background: rgba(168, 85, 247, 1);"></div>
          <div class="w-10 h-10 rounded-[var(--radius-sm)] flex items-center justify-center flex-shrink-0" style="background: rgba(168, 85, 247, 0.08);">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="rgba(168, 85, 247, 1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 18h6"/>
              <path d="M10 22h4"/>
              <path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0018 8 6 6 0 006 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 018.91 14"/>
            </svg>
          </div>
        </div>
        <div class="flex-1 min-w-0 ml-1">
          <div class="text-base font-semibold" style="color: var(--todo-text-primary); line-height: 1.3;">灵感</div>
          <div class="text-xs mt-0.5" style="color: var(--todo-text-tertiary);">创意、想法、灵感</div>
          <div class="text-xs mt-1.5" style="color: var(--todo-text-secondary);">3 项任务</div>
        </div>
        <div class="flex items-center gap-2 flex-shrink-0 ml-3">
          <button class="bg-transparent border-none cursor-pointer p-1 transition-colors duration-200" style="color: var(--todo-text-tertiary);">
            <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="currentColor">
              <circle cx="12" cy="6" r="1.5"/>
              <circle cx="12" cy="12" r="1.5"/>
              <circle cx="12" cy="18" r="1.5"/>
            </svg>
          </button>
          <button class="bg-transparent border-none cursor-pointer p-1 transition-colors duration-200" style="color: var(--todo-text-tertiary);">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Add New Category Card -->
      <div class="flex items-center justify-center gap-2 rounded-[var(--radius-md)] p-4 cursor-pointer transition-colors duration-200" style="background: var(--todo-bg-subtle); border: 1.5px dashed var(--todo-border);">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="var(--todo-primary-500)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        <span class="text-base font-semibold" style="color: var(--todo-primary-500);">添加新分类</span>
      </div>

    </div>

  </main>

  <!-- Bottom Tab Bar (categories tab active) -->
  <nav class="fixed bottom-0 left-0 right-0 z-50 bg-[var(--todo-bg-card)] border-t border-[var(--todo-border)]" style="padding-bottom: env(safe-area-inset-bottom, 0px); font-family: var(--font-sans);">
    <div class="flex items-end justify-around px-2 pt-2 pb-2 max-w-lg mx-auto">
      <!-- Tasks Tab -->
      <button data-tab-key="tasks" data-dom-id="tab-tasks"
              class="flex flex-col items-center justify-center gap-0.5 w-16 h-14 rounded-xl transition-colors duration-200">
        <svg class="w-5 h-5" style="color: var(--todo-text-tertiary);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 11l3 3L22 4"/>
          <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
        </svg>
        <span class="text-[10px] font-medium" style="color: var(--todo-text-tertiary);">Tasks</span>
      </button>
      <!-- Add Tab (Center FAB) -->
      <button data-tab-key="add" data-dom-id="tab-add-categories"
              class="flex items-center justify-center w-12 h-12 -mt-6 rounded-full shadow-[var(--shadow-float)] transition-transform duration-200 active:scale-95" style="background: var(--todo-primary-500);">
        <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="16"/>
          <line x1="8" y1="12" x2="16" y2="12"/>
        </svg>
      </button>
      <!-- Categories Tab (Active) -->
      <button data-tab-key="categories" data-active="true"
              class="flex flex-col items-center justify-center gap-0.5 w-16 h-14 rounded-xl transition-colors duration-200" style="background: var(--todo-primary-50);">
        <svg class="w-5 h-5" style="color: var(--todo-primary-500);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 20a2 2 0 002-2V8a2 2 0 00-2-2h-7.93a2 2 0 01-1.66-.9l-.82-1.2A2 2 0 008.93 3H4a2 2 0 00-2 2v13a2 2 0 002 2h16z"/>
          <line x1="12" y1="11" x2="12" y2="17"/>
          <line x1="9" y1="14" x2="15" y2="14"/>
        </svg>
        <span class="text-[10px] font-medium" style="color: var(--todo-primary-500);">Categories</span>
      </button>
    </div>
  </nav>

</body>
</html>
