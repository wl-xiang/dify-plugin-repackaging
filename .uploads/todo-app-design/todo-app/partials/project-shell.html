<!-- SLOT: pageTitle -->

<!-- Bottom Tab Bar -->
<nav class="fixed bottom-0 left-0 right-0 z-50 bg-[var(--todo-bg-card)] border-t border-[var(--todo-border)]"
     style="padding-bottom: env(safe-area-inset-bottom, 0px); font-family: var(--font-sans);">
  <div class="flex items-end justify-around px-2 pt-2 pb-2 max-w-lg mx-auto">

    <!-- SLOT: activeTab -->

    <!-- Tasks Tab -->
    <button data-tab-key="tasks" data-active="true"
            class="flex flex-col items-center justify-center gap-0.5 w-16 h-14 rounded-xl transition-colors duration-200 bg-[var(--todo-primary-50)]">
      <!-- Active: checkmark list icon (20px) -->
      <svg class="w-5 h-5 text-[var(--todo-primary-500)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 11l3 3L22 4"/>
        <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
      </svg>
      <span class="text-[10px] font-medium text-[var(--todo-primary-500)]">Tasks</span>
    </button>

    <!-- Add Tab (Center FAB) -->
    <button data-tab-key="add"
            class="flex items-center justify-center w-12 h-12 -mt-6 rounded-full bg-[var(--todo-primary-500)] shadow-[var(--shadow-float)] transition-transform duration-200 active:scale-95">
      <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="16"/>
        <line x1="8" y1="12" x2="16" y2="12"/>
      </svg>
      <!-- No label for center FAB -->
    </button>

    <!-- Categories Tab -->
    <button data-tab-key="categories"
            class="flex flex-col items-center justify-center gap-0.5 w-16 h-14 rounded-xl transition-colors duration-200">
      <!-- Inactive: folder/tag icon (20px) -->
      <svg class="w-5 h-5 text-[var(--todo-text-tertiary)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 20a2 2 0 002-2V8a2 2 0 00-2-2h-7.93a2 2 0 01-1.66-.9l-.82-1.2A2 2 0 008.93 3H4a2 2 0 00-2 2v13a2 2 0 002 2h16z"/>
        <line x1="12" y1="11" x2="12" y2="17"/>
        <line x1="9" y1="14" x2="15" y2="14"/>
      </svg>
      <span class="text-[10px] font-medium text-[var(--todo-text-tertiary)]">Categories</span>
    </button>

  </div>
</nav>
