name: Repackage Dify Plugin

on:
  workflow_dispatch:
    inputs:
      plugin_author:
        description: "plugin author"
        required: true
        type: string
      plugin_name:
        description: "plugin name"
        required: true
        type: string
      plugin_version:
        description: "plugin version"
        required: true
        type: string
      platform_arm:
        description: "Use ARM platform (true = aarch64, false = x86_64). Wheels for both manylinux_2_17 and manylinux_2_28 are collected for compatibility."
        required: true
        default: "false"
      glibc_version:
        description: "Target glibc version. Select 'other' to specify a custom version."
        required: true
        type: choice
        default: "2.17"
        options:
          - "2.17"
          - "2.28"
          - "2.34"
          - "other"
      custom_glibc_version:
        description: "Custom glibc version (used only when glibc_version is 'other'). Example: 2.31"
        required: false
        type: string

jobs:
  repackage:
    runs-on: ubuntu-latest
    steps:
      - name: Print workflow inputs
        run: |
          echo "plugin_author        = ${{ inputs.plugin_author }}"
          echo "plugin_name          = ${{ inputs.plugin_name }}"
          echo "plugin_version       = ${{ inputs.plugin_version }}"
          echo "platform_arm         = ${{ inputs.platform_arm }}"
          echo "glibc_version        = ${{ inputs.glibc_version }}"
          echo "custom_glibc_version = ${{ inputs.custom_glibc_version }}"

      - name: Resolve platform
        run: |
          # Resolve architecture
          if [ "${{ inputs.platform_arm }}" = "true" ]; then
            ARCH="aarch64"
            ARCH_SUFFIX="-arm"
          else
            ARCH="x86_64"
            ARCH_SUFFIX=""
          fi

          # Resolve glibc version
          GLIBC_VERSION="${{ inputs.glibc_version }}"
          if [ "$GLIBC_VERSION" = "other" ]; then
            GLIBC_VERSION="${{ inputs.custom_glibc_version }}"
            if [ -z "$GLIBC_VERSION" ]; then
              echo "::error::custom_glibc_version must be provided when glibc_version is 'other'"
              exit 1
            fi
          fi

          # Validate glibc version format (e.g. 2.17, 2.28, 2.34, 2.31)
          if ! echo "$GLIBC_VERSION" | grep -Eq '^[0-9]+\.[0-9]+$'; then
            echo "::error::invalid glibc version '$GLIBC_VERSION'. Expected format like 2.17"
            exit 1
          fi

          # Build manylinux tag: "2.17" -> "2_17" -> manylinux_2_17_x86_64
          GLIBC_TAG="${GLIBC_VERSION//./_}"
          echo "PIP_PLATFORM=manylinux_${GLIBC_TAG}_${ARCH}" >> "$GITHUB_ENV"
          echo "PACKAGE_SUFFIX=offline-${GLIBC_VERSION}${ARCH_SUFFIX}" >> "$GITHUB_ENV"
          echo "Resolved PIP_PLATFORM=manylinux_${GLIBC_TAG}_${ARCH}"
          echo "Resolved PACKAGE_SUFFIX=offline-${GLIBC_VERSION}${ARCH_SUFFIX}"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Make plugin_repackaging.sh executable
        run: chmod +x ./plugin_repackaging.sh

      - name: Run plugin repackaging script
        run: |
          PIP_MIRROR_URL=https://pypi.org/simple \
          ./plugin_repackaging.sh \
          -p ${{ env.PIP_PLATFORM }} \
          -s ${{ env.PACKAGE_SUFFIX }} \
          market \
          "${{ github.event.inputs.plugin_author }}" \
          "${{ github.event.inputs.plugin_name }}" \
          "${{ github.event.inputs.plugin_version }}"

      - name: Find repackaged artifact
        run: |
          ARTIFACT_PATH=$(find . -type f -name "*-${PACKAGE_SUFFIX}.difypkg" | head -n 1)
          if [ -z "$ARTIFACT_PATH" ]; then
            echo "No *-${PACKAGE_SUFFIX}.difypkg artifact found!"
            exit 1
          fi
      
          echo "ARTIFACT_PATH=$ARTIFACT_PATH" >> $GITHUB_ENV
          echo "ARTIFACT_NAME=$(basename "$ARTIFACT_PATH")" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_PATH }}
